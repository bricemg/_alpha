<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BRICEMG / CMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Doto:wght@300;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="css/admin-sections.css" />
  </head>
  <body>
    <div id="authPanel" class="auth-panel">
      <h2>CMS Minimal</h2>
      <div class="field">
        <label for="secret">Clé d'accès</label>
        <input id="secret" type="password" placeholder="Entrez la clé" />
      </div>
      <div class="actions">
        <button id="loginBtn">Ouvrir le CMS</button>
      </div>
    </div>

    <div id="adminPanel" class="admin-shell hidden">
      <h1>Gestion du contenu</h1>

      <div class="admin-grid">
        <div>
          <h3 style="margin-bottom: 16px; font-size: 14px; letter-spacing: 0.14em;">INFO SITE</h3>
          <div class="field">
            <label>Nom du site</label>
            <input id="siteTitle" type="text" value="BRICEMG / STUDIO" />
          </div>
          <div class="field">
            <label>Sous-titre</label>
            <input id="siteSubtitle" type="text" value="DESIGN / CODE / VISION" />
          </div>
          <div class="field">
            <label>Phrase d'accueil</label>
            <textarea id="heroClaim">DES IDÉES QUI ONT UNE FORME, UNE VOIX ET UNE VITESSE.</textarea>
          </div>
          <div class="field">
            <label>Introduction</label>
            <textarea id="intro">Je crée des interfaces, des identités visuelles et des expériences web qui donnent du sens à une idée.</textarea>
          </div>
          <div class="field">
            <label>À propos</label>
            <textarea id="about">Je conçois et développe des projets à la croisée du design, du produit et du code.</textarea>
          </div>
          <div class="field">
            <label>Email</label>
            <input id="email" type="email" value="bonjour@bricemg.dev" />
          </div>
        </div>

        <div>
          <h3 style="margin-bottom: 16px; font-size: 14px; letter-spacing: 0.14em;">ATELIER (CARTES)</h3>
          <div id="cardsContainer"></div>

          <h3 style="margin-top: 32px; margin-bottom: 16px; font-size: 14px; letter-spacing: 0.14em;">PROJETS</h3>
          <div id="projectsContainer"></div>
        </div>
      </div>

      <div class="actions">
        <button id="saveBtn">Enregistrer</button>
        <button id="resetBtn" class="secondary">Réinitialiser</button>
        <a href="index.html" style="display:inline-block; margin-top: 10px; color: var(--ink); text-decoration: underline;">Voir le site</a>
      </div>

      <div id="saveMessage" class="save-message hidden">✓ Enregistré avec succès</div>
    </div>

    <script src="content.js"></script>
    <script src="js/utils/storage.js"></script>
    <script src="js/admin/form.js"></script>
    <script src="js/admin/main.js"></script>
  </body>
</html>
